[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[[redirects]]
  from = "/api/*"
  to = "https://nmgjkexfgytjivxudsmo.supabase.co/functions/v1/wingchat-testing/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: https://nmgjkexfgytjivxudsmo.supabase.co; media-src 'self' blob: https://nmgjkexfgytjivxudsmo.supabase.co; connect-src 'self' https://nmgjkexfgytjivxudsmo.supabase.co wss://nmgjkexfgytjivxudsmo.supabase.co; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
